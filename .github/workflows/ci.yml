# Testes a cada push; numa tag v* também gera os executáveis e publica a Release.
name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

env:
  GODOT_VERSION: "4.6"

jobs:
  testes:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Godot
        run: |
          base=https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable
          curl -sSLo godot.zip "$base/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q godot.zip && mv Godot_v${GODOT_VERSION}-stable_linux.x86_64 /usr/local/bin/godot
      - name: Testes (save, quadro, partida completa)
        run: tools/testes.sh godot

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: testes
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Godot e export templates
        run: |
          base=https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable
          curl -sSLo godot.zip "$base/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q godot.zip && mv Godot_v${GODOT_VERSION}-stable_linux.x86_64 /usr/local/bin/godot
          curl -sSLo tpl.tpz "$base/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          dir=~/.local/share/godot/export_templates/${GODOT_VERSION}.stable
          mkdir -p "$dir" && unzip -q tpl.tpz && mv templates/* "$dir/"
      - name: Exportar
        run: |
          godot --headless --path . --import || true
          mkdir -p build/linux build/windows
          godot --headless --path . --export-release "Linux" build/linux/FragmentsOfMemory.x86_64
          godot --headless --path . --export-release "Windows" build/windows/FragmentsOfMemory.exe
          v=${GITHUB_REF_NAME}
          (cd build/linux && zip -q ../../FragmentsOfMemory-$v-linux.zip *)
          (cd build/windows && zip -q ../../FragmentsOfMemory-$v-windows.zip *)
      - name: Publicar Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notas=$(awk -v t="## [${GITHUB_REF_NAME#v}]" 'index($0,t)==1{f=1;next} /^## \[/{f=0} f' CHANGELOG.md)
          gh release create "$GITHUB_REF_NAME" FragmentsOfMemory-*.zip --title "Fragments of Memory $GITHUB_REF_NAME" --notes "$notas"
